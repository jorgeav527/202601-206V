<!DOCTYPE html>
<html>

<head>
  <title>FastAPI Blog</title>

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container py-4">

  <!-- HEADER -->
  <div class="bg-primary text-white p-4 rounded shadow-sm mb-4">
    <h1 class="mb-1">Gestión de publicaciones</h1>
    <p class="mb-0">FastAPI + HTMX + Bootstrap</p>
  </div>

  <div class="row">

    <!-- FORMULARIO -->
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
          Crear publicación
        </div>

        <div class="card-body">
          <form hx-post="/post-ui" hx-target="#create-status" hx-on::after-request="this.reset()">

            <div class="mb-3">
              <label class="form-label">Título</label>
              <input type="text" name="title" class="form-control" placeholder="Ingrese el título" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Contenido</label>
              <textarea name="content" class="form-control" rows="4" placeholder="Ingrese el contenido" required></textarea>
            </div>

            <button type="submit" class="btn btn-success w-100">
              Guardar publicación
            </button>

          </form>

          <div id="create-status" class="mt-3"></div>
        </div>
      </div>
    </div>

    <!-- LISTA -->
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
          Publicaciones
        </div>

        <div class="card-body">

          <!-- BUSCADOR -->
          <div class="mb-3">
            <input type="text"
                   name="q"
                   class="form-control"
                   placeholder="Buscar por título o contenido..."
                   hx-get="/posts/search"
                   hx-target="#table-area"
                   hx-trigger="keyup changed delay:300ms">
          </div>

          <!-- BOTÓN -->
          <button class="btn btn-primary mb-3"
                  hx-get="/post-table"
                  hx-target="#table-area">
            Cargar todas las publicaciones
          </button>

          <!-- TABLA -->
          <div id="table-area">
            <div class="alert alert-info mb-0">
              Aún no se han cargado datos.
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <footer class="mt-5 text-center">
    <a href="/docs" class="btn btn-outline-secondary">
      Ver documentación API
    </a>
  </footer>

</body>
</html>
