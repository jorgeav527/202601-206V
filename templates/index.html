{% extends "base.html" %}

{% block title %}Registro de Usuario{% endblock %}

{% block content %}

<div class="card shadow">
    <div class="card-header bg-primary text-white">
        <h3 class="mb-0">Registro de Usuario</h3>
    </div>

    <div class="card-body">
        <form action="/count" method="post">

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" id="nombre" name="nombre" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="edad" class="form-label">Edad:</label>
                <input type="number" id="edad" name="edad" min="0" class="form-control" required>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" id="casado" name="casado" class="form-check-input">
                <label for="casado" class="form-check-label">¿Está casado?</label>
            </div>

            <button type="submit" class="btn btn-success">Guardar usuario</button>
        </form>
    </div>
</div>

{% endblock %}
