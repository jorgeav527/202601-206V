{% extends "base.html" %}
 
{% block title %}{{ post['title'] }}{% endblock %}
 
{% block content %}
<div class="row justify-content-center">
<div class="col-md-8">
 
        <div class="card shadow-sm">
<div class="card-header bg-dark text-white">
<h4 class="mb-0">{{ post['title'] }}</h4>
</div>
 
            <div class="card-body">
<p class="text-muted">

</p>
 
                <p class="fs-5">

                    {{ post['content'] }}
</p>
 
                <hr>
 
                <div class="d-flex justify-content-between">
<a href="{{ url_for('main.get_all_post') }}" class="btn btn-secondary">

                        Volver
</a>
 
                    <div>
<a 

                            href="{{ url_for('main.edit', id=post['id']) }}" 

                            class="btn btn-warning">

                            Editar
</a>
 
                        <form 

                            action="{{ url_for('main.delete', id=post['id']) }}" 

                            method="POST" 

                            class="d-inline">
<button 

                                type="submit" 

                                class="btn btn-danger"

                                onclick="return confirm('¿Está seguro de eliminar este post?')">

                                Eliminar
</button>
</form>
</div>
</div>
 
            </div>
</div>
 
    </div>
</div>

{% endblock %}
