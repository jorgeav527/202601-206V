{% extends "base.html" %}
 
{% block title %}Crear Post{% endblock %}
 
{% block content %}
<div class="row justify-content-center">
<div class="col-md-8">
 
        <div class="card shadow-sm">
<div class="card-header bg-primary text-white">
<h4 class="mb-0">Crear nuevo post</h4>
</div>
 
            <div class="card-body">
<form method="post" x-data="{ content: '' }">
 
                    <div class="mb-3">
<label class="form-label">Título</label>
<input 

                            type="text" 

                            name="title" 

                            class="form-control"

                            placeholder="Ingrese el título del post"

                            required>
</div>
 
                    <div class="mb-3">
<label class="form-label">Contenido</label>
<textarea 

                            name="content" 

                            class="form-control" 

                            rows="6"

                            x-model="content"

                            placeholder="Escriba el contenido del post"

                            required></textarea>
 
                        <small class="text-muted">
<span x-text="content.length"></span> caracteres
</small>
</div>
 
                    <div class="d-flex justify-content-between">
<a href="{{ url_for('main.get_all_post') }}" class="btn btn-secondary">

                            Cancelar
</a>
 
                        <button type="submit" class="btn btn-primary">

                            Guardar
</button>
</div>
 
                </form>
</div>
</div>
 
    </div>
</div>

{% endblock %}
