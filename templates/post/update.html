{% extends "base.html" %}
 
{% block title %}Actualizar Post{% endblock %}
 
{% block content %}
<div class="row justify-content-center">
<div class="col-md-8">
 
        <div class="card shadow-sm">
<div class="card-header bg-warning">
<h4 class="mb-0">Actualizar post</h4>
</div>
 
            <div class="card-body">
<form method="post">
 
                    <div class="mb-3">
<label class="form-label">Título</label>
<input 

                            type="text" 

                            name="title" 

                            value="{{ post['title'] }}" 

                            class="form-control"

                            required>
</div>
 
                    <div class="mb-3">
<label class="form-label">Contenido</label>
<textarea 

                            name="content" 

                            class="form-control" 

                            rows="6"

                            required>{{ post['content'] }}</textarea>
</div>
 
                    <div class="d-flex justify-content-between">
<a href="{{ url_for('main.get_all_post') }}" class="btn btn-secondary">

                            Cancelar
</a>
 
                        <button type="submit" class="btn btn-warning">

                            Actualizar
</button>
</div>
 
                </form>
</div>
</div>
 
    </div>
</div>

{% endblock %}
