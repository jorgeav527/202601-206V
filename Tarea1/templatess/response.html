<!DOCTYPE html>
<html>
<head>
    <title>Respuesta</title>
</head>
<body>
    <h1>Registro guardado correctamente</h1>

    <p>Número de registros: {{ count_response }}</p>

    <h2>Personas registradas</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Casado</th>
            </tr>
        </thead>

        <tbody>
            {% for persona in registros %}
            <tr>
                <td>{{ persona.nombre }}</td>
                <td>{{ persona.edad }}</td>
                <td>{{ persona.casado }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br>

    <a href="/count">Registrar otra persona</a>
</body>
</html>
